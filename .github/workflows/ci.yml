name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile the application
        run: python -m compileall -q app.py database.py ml_model.py ai_report.py

      - name: Verify ML model artifacts are present
        run: |
          test -s ml/disease_model.pkl
          test -s ml/label_encoder.pkl

      - name: Smoke-test the trained model
        run: |
          python -c "import joblib; m = joblib.load('ml/disease_model.pkl'); print('model loaded:', type(m).__name__)"

      - name: Check the app module imports cleanly
        run: python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('templates').rglob('*.html')]"

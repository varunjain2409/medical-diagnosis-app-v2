{% extends "base.html" %}
{% block title %}Login – MediAI{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 80px);">
  <div class="card p-4" style="width:100%; max-width:420px;">
    <div class="text-center mb-4">
      <div style="font-size:3rem;">🏥</div>
      <h4 class="fw-bold">Welcome Back</h4>
      <p class="text-muted">Sign in to MediAI</p>
    </div>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2">
        <i class="bi bi-box-arrow-in-right me-2"></i>Login
      </button>
    </form>
    <p class="text-center mt-3 text-muted small">
      Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
    </p>
    <hr>
    <p class="text-center text-muted small mb-0">
      <strong>Demo:</strong> Username: <code>admin</code> | Password: <code>admin123</code>
    </p>
  </div>
</div>
{% endblock %}

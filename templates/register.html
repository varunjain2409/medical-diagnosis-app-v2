{% extends "base.html" %}
{% block title %}Register – MediAI{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 80px);">
  <div class="card p-4" style="width:100%; max-width:460px;">
    <div class="text-center mb-4">
      <div style="font-size:3rem;">🏥</div>
      <h4 class="fw-bold">Create Account</h4>
      <p class="text-muted">Join MediAI – It's free</p>
    </div>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Full Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="Your full name" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Min. 6 characters" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2">
        <i class="bi bi-person-plus me-2"></i>Create Account
      </button>
    </form>
    <p class="text-center mt-3 text-muted small">
      Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
